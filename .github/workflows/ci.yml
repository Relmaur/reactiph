name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      # The Transpiler parity suite (ADR 0006) executes transpiled JS in
      # real Node and compares it against real PHP output — not optional
      # tooling, a required test dependency from Part 4 onward.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: ramsey/composer-install@v3

      - run: composer test

      - run: composer analyse

      - run: composer cs-check
